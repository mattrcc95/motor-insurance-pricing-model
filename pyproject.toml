[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor_pricing"
version = "0.1.0"
description = "Claim frequency and severity modelling on freMTPL2: GLMs vs LightGBM"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
